<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <meta name="description" content="Fun Pay - Earn rewards through tasks, ads, referrals, and more!">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fun Pay">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In -->
  <meta name="google-signin-client_id" content="198439372867-5vfkneio32asqs6im247t0sle8dkcccs.apps.googleusercontent.com">

  <!-- Google AdSense verification -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5256378460782254"
     crossorigin="anonymous"></script>

  <!-- Referral deep-link fallback.
       When someone opens /signup?ref=CODE but does NOT have the app installed,
       this browser would show the web app. Instead we forward them to the Play
       Store so they can download the app (install tracked with the code).
       If the app IS installed, the OS intercepts the link before this runs. -->
  <script>
    (function () {
      try {
        var path = window.location.pathname;
        if (path === '/signup' || path.indexOf('/signup/') === 0) {
          var ref = new URLSearchParams(window.location.search).get('ref') || '';
          var url = 'https://play.google.com/store/apps/details?id=com.spydev.funpay';
          if (ref) {
            url += '&referrer=' + encodeURIComponent('utm_source=referral&utm_campaign=' + ref);
          }
          window.location.replace(url);
        }
      } catch (e) {}
    })();
  </script>

  <title>Fun Pay</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
